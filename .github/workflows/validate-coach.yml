name: Validate Handstand Lab and Coach

on:
  push:
    branches: [feat/gemini-coach-preview]
  pull_request:
    paths:
      - 'preview/**'
      - 'vercel-app/**'
      - 'coach-app/**'
      - 'tests/**'
      - '.github/workflows/validate-coach.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  handstand-lab:
    name: Handstand Lab
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Handstand Lab JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in preview/*.js vercel-app/*.js vercel-app/api/*.js; do
            node --check "$file"
          done
      - name: Run Handstand Lab tests
        run: >-
          node --test
          tests/analyzer-quality.test.mjs
          tests/coach.test.mjs
          tests/consent.test.mjs
          tests/exercise-library.test.mjs
          tests/handstand-summary.test.mjs
          tests/training.test.mjs
          tests/vercel-coach.test.cjs
          tests/workout.test.mjs

  handstand-coach:
    name: Handstand Coach
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Handstand Coach JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in coach-app/*.js coach-app/*.mjs; do
            node --check "$file"
          done
      - name: Build Handstand Coach
        run: node coach-app/build.mjs
      - name: Verify packaged canonical exercise catalogue
        run: cmp vercel-app/exercise-library.js coach-app/public/catalog.js
      - name: Run Handstand Coach tests
        run: node --test tests/coach-demo.test.mjs
