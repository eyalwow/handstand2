name: Validate handstand coach
on:
  push:
    branches: [feat/gemini-coach-preview]
  pull_request:
    paths:
      - 'preview/**'
      - 'vercel-app/**'
      - 'tests/**'
      - '.github/workflows/validate-coach.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check AI module syntax
        run: node --check preview/ai-feedback.js
      - name: Check Vercel modules
        run: |
          node --check vercel-app/analysis-history.js
          node --check vercel-app/movalyt-ui.js
          node --check vercel-app/handstand-engine.js
          node --check vercel-app/handstand-entry.js
          node --check vercel-app/handstand-temporal.js
          node --check vercel-app/handstand-fall.js
          node --check vercel-app/handstand-coaching.js
          node --check vercel-app/handstand-insights-ui.js
          node --check vercel-app/pose-overlay.js
          node --check vercel-app/onboarding-ui.js
          node --check vercel-app/onboarding-data.js
          node --check vercel-app/analysis-catalog.js
          node --check vercel-app/analysis-registry.js
          node --check vercel-app/campaign-artwork.js
          node --check vercel-app/ui-elements.js
          node --check vercel-app/ai-feedback.js
          node --check vercel-app/analysis-performance.js
          node --check vercel-app/pose-runtime.js
          node --check vercel-app/pose-worker.js
          node --check vercel-app/pose-main.js
          node --check vercel-app/video-sampling.js
          node --check vercel-app/server-gemini.js
          node --check vercel-app/training-core.js
          node --check vercel-app/exercise-library.js
          node --check vercel-app/exercise-media.js
          node --check vercel-app/training-ui.js
          node --check vercel-app/workout-core.js
          node --check vercel-app/workout-ui.js
          node --check vercel-app/workout-media.js
          node --check vercel-app/api/coach.js
      - name: Run analyzer, privacy, API, and training tests
        run: node --test tests/*.test.*
      - name: Check Chromium smoke test harness
        run: python3 -m py_compile scripts/smoke-mediapipe-worker.py scripts/verify-intelligent-handstand.py scripts/verify-movalyt-ui.py scripts/verify-pr30-refinement.py
